# The skill dictionary.
#
#   "Name" = ["alias", ...]
#   "Name" = { aliases = [...], case = true, context = true, named = false, makers = [...] }
#
# Matching ignores case and punctuation, and accepts a plural "s".
#   case     the name must be spelled exactly like this (aliases stay case-insensitive)
#   context  counts only when another skill is on the same line
#   named    set to false when the name itself is too ambiguous to match
#   makers   employer tokens whose postings never count toward this skill

# Phrases that contain a skill's name but mean something else.
mask = [
  "R&D", "C-suite", "C-level", "series C", "class C", "B2C", "vitamin C",
  "go to market", "go-to", "on the go", "Go live", "ready to go",
  "excel in", "excel at", "excel as", "excel when", "you excel", "to excel", "and excel",
  "swift action", "swift response", "react to", "react quickly",
  "spark joy", "spark curiosity", "the rest", "and rest", "at rest",
  "Rust Belt", "Rust-proof", "linear algebra", "linear regression", "linear programming",
  "AWS re:Invent", "sales tax", "privacy policy", "security clearance", "social security",
  "compliance with", "in compliance", "recruiting process", "recruitment process",
