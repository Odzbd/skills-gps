# Title patterns, checked top to bottom; the first match wins.
# Put specific roles above general ones. Patterns are case-insensitive regexes
# matched on whole words.

"Product manager" = 'product (?:manager|management|owner|lead)|(?:director|head|vp|group)[ ,]+(?:of )?product(?! (?:marketing|design|security))|chief product officer|technical product'
"Product marketing" = 'product marketing'
"Program & project manager" = '(?:program|project|programme|delivery|portfolio) (?:manager|management|lead|coordinator|director)|tpm|scrum master|(?:program|project)s? (?:\w+ )?manager|chief of staff'
"Quant researcher & trader" = 'quantitative (?:researcher|analyst|developer|trader|trading|research)|quant|trader'
"Data scientist" = 'data scien\w+|decision scien\w+|statistician'
"Machine learning engineer" = 'machine learning|ml (?:\w+ )?engineer|ai (?:\w+ )?engineer|applied ai|deep learning|mlops|computer vision|perception engineer|(?:ai|llm|research) engineer|applied scientist|member of technical staff'
"Research scientist" = 'research scientist|researcher(?!.*(?:ux|user))|ai scientist|research fellow'
"Data engineer" = 'data engineer\w*|analytics engineer\w*|(?:data|database) (?:platform |warehouse )?(?:architect|engineer)|data infrastructure|database administrator|software engineer.*\bdata\b'
"Data analyst" = 'data analyst|(?:business|product|marketing|bi|reporting|insights|analytics) (?:intelligence )?analyst|data analytics|business intelligence'
"Security engineer" = 'security (?!guard|officer).*(?:engineer|architect|analyst|researcher|operations|manager|lead)|(?:detection|offensive|threat|soc|product|application) (?:\w+ )?security|cyber\w*|(?:detection|threat).*(?:engineer|analyst)|penetration tester'
"DevOps & SRE" = 'devops|site reliability|sre|(?:platform|infrastructure|cloud|systems?|reliability|production|network) engineer(?:ing)?(?=.*(?:cloud|platform|infra\w*|network|production|site|kubernetes|software))|infrastructure engineer|cloud engineer|network engineer|production engineer'
"Mobile engineer" = '(?:ios|android|mobile|react native) (?:\w+ )?(?:engineer|developer)|(?:engineer|developer).*(?:ios|android|mobile)'
"Frontend engineer" = 'front[ -]?end|ui engineer|web (?:engineer|developer)|design engineer(?=.*(?:web|product|ui))'
"Solutions engineer" = '(?:solutions?|sales|pre-?sales|customer|field|forward[ -]deployed|implementation|integration|support|partner|deployment)s? (?:\w+ )?(?:engineer|architect|consultant)\w*|technical account manager|developer advocate|developer relations|solutions? (?:lead|manager)'
"Embedded & firmware engineer" = 'embedded|firmware|fpga|asic|rtl|silicon|soc (?:design|verification)|design verification|physical design'
"Hardware & mechanical engineer" = '(?:mechanical|electrical|hardware|manufacturing|aerospace|propulsion|avionics|structur\w+|thermal|rf|materials?|process|industrial|robotics?|optical|power|controls?|systems|test|integration|launch|vehicle|battery|quality|reliability|civil|design|equipment|tooling|production|mechatronics|electronics|electromechanical|flight|gnc|fluids?|mission|facilities|build|antenna|payload|satellite|radar) (?:[\w&,/-]+ ){0,3}engineer\w*|(?:engineer),? (?:mechanical|electrical|manufacturing|propulsion|structures)'
"QA engineer" = 'qa|quality assurance|sdet|test automation|software test'
"Software engineer" = 'software|swe|back[ -]?end|full[ -]?stack|developer|programmer|gameplay|engineer(?:ing)? manager|engineering (?:lead|director)|(?:director|head|vp|manager)[ ,]+(?:of )?engineering|staff engineer|principal engineer|engineer'
"Technician & production" = 'technician|machinist|welder|assembler|fabricat\w+|operator|mechanic|inspector|warehouse|electrician|installer|production (?:associate|supervisor|lead)|maintenance|painter|driver'
"Designer & UX researcher" = '(?:product|ux|ui|visual|graphic|brand|motion|interaction|content|web|game|level|service) design\w*|designer|ux|user research\w*|art director|creative director|artist|animator|illustrator|head of design'
"Legal & compliance" = 'counsel|legal|attorney|paralegal|compliance|privacy|policy|regulatory|lawyer|contracts|contract (?:manager|specialist|administrator|negotiator)|aml|kyc|financial crimes?|risk|fraud|trust (?:and|&) safety|governance'
"Marketing & content" = 'marketing|marketer|growth|seo|content|social media|brand|communications|copywriter|editor\w*|reporter|journalist|writer|public relations|pr manager|community|creative|events?|media (?:planner|buyer|manager)|demand gen\w*|influencer|campaign|paid (?:media|social|search)'
"Customer success & support" = 'customer (?:success|support|experience|service|care|operations)|client (?:success|services?|partner)|support (?:specialist|engineer|agent|representative|associate|lead|manager)|onboarding|implementation|account manage\w+|renewals?|technical support|relationship manager'
"Sales & account executive" = 'sales|account executive|business development|bdr|sdr|partnerships?|partner manager|alliances|go[ -]to[ -]market|gtm|revenue|account director|commercial|territory|deal desk|account manager|partner (?:lead|director|development)'
"Recruiting & HR" = 'recruit\w+|talent|people (?:partner|operations|ops|business|team|generalist|experience|manager|analytics|programs?)|human resources|hr|hrbp|compensation|benefits|payroll|total rewards|learning (?:and|&) development|sourcer'
"Finance & accounting" = 'financ\w+|account(?:ant|ing)|fp&a|controller|tax|treasury|audit\w*|investor relations|investment\w*|accounts (?:payable|receivable)|strategic finance|trader|trading|actuar\w+|billing|underwrit\w+|credit|banking|private equity|portfolio'
"Supply chain & procurement" = 'supply chain|logistics|procurement|sourcing|buyer|category manager|inventory|materials? (?:planner|manager|handler)|planner|fulfillment|supplier|vendor|fleet'
"Health & life sciences" = 'nurse|physician|clinic\w*|therapist|medical|pharmac\w+|patient|scientist|laboratory|lab|biolog\w+|phlebotomist|care (?:manager|coordinator|navigator)|psychiatr\w+|psycholog\w+|genetic\w*|chemist|dietitian|health coach|provider|np|md|veterinar\w+'
"Operations & strategy" = 'operations|strateg\w+|business (?:manager|analyst|partner|lead|operations)|general manager|bizops|analyst|facilities|workplace|office|executive assistant|administrative|assistant|coordinator|store|restaurant|team member|associate|data center|construction'
